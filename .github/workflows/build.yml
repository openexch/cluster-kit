name: CI

on:
  push:
    branches: [main]
  pull_request:

# The publish below is check-then-deploy; two quick merges to main can race it.
# One at a time, the next one queues.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The version guard diffs against the merge-base with main.
          fetch-depth: 0

      # Publish is existence-gated, so source changes without a version bump are
      # published NOWHERE: consumers pinning the old version keep old bytes and
      # nothing ever says so (it happened: d3c0f91 changed BundleCapture and
      # StagingArchive and stayed unreachable until b8d47c1 bumped 0.1.3).
      - name: "Guard: version must move when src does"
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE=$(git merge-base HEAD origin/main)
          if git diff --quiet "$BASE" HEAD -- src/main; then
            echo "src/main unchanged; no bump needed."
            exit 0
          fi
          # Project version = the line after this pom's own artifactId.
          OLD=$(git show "$BASE:pom.xml" | awk '/<artifactId>cluster-kit<\/artifactId>/{getline; print; exit}')
          NEW=$(awk '/<artifactId>cluster-kit<\/artifactId>/{getline; print; exit}' pom.xml)
          if [ "$OLD" = "$NEW" ]; then
            echo "::error::src/main changed but pom.xml <version> did not ($NEW). Publish is existence-gated: without a bump these changes are unreachable by any consumer. Bump the version."
            exit 1
          fi
          echo "version moves with src: $OLD -> $NEW"
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          # Generates the settings.xml that gives `deploy` its credentials.
          # Without it the deploy step runs, uploads nothing, and still reports
          # BUILD SUCCESS - which is how the first publish silently produced no
          # artifact and only the consumers' builds noticed.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - run: mvn -B clean verify

      # Publish only from main. Both engines consume this artifact, so a
      # version published from a branch would put one engine on code the other
      # has never seen — the exact divergence this repo exists to remove.
      # Published versions are IMMUTABLE - Packages answers 409 to a re-upload,
      # which is the right behaviour for a substrate two engines pin. So the
      # publish is conditional on the version not already existing, and pushing
      # to main without a version bump is simply a no-op rather than a failure.
      - name: Publish to GitHub Packages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          URL="https://maven.pkg.github.com/openexch/cluster-kit/com/openexchange/cluster-kit/$VERSION/cluster-kit-$VERSION.jar"
          # -L: Packages redirects to storage, so a bare status check reads a
          # successful publish as a failure.
          BEFORE=$(curl -sL -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" "$URL")

          if [ "$BEFORE" = "200" ]; then
            echo "cluster-kit $VERSION is already published; nothing to do."
            exit 0
          fi

          mvn -B deploy -DskipTests

          # A publish step that cannot tell "uploaded" from "did nothing" is a
          # step that says yes. The first run of this workflow reported BUILD
          # SUCCESS having uploaded nothing at all, and only the consumers'
          # builds noticed.
          AFTER=$(curl -sL -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" "$URL")
          echo "$URL -> $AFTER"
          test "$AFTER" = "200"
